<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06285d">
  <title>Portal Mayorista · SiasCloud</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3.3.0-desktop2">
  <link rel="icon" type="image/png" sizes="192x192" href="siascloud-icon-192.png?v=3.3.0-desktop2">
  <link rel="manifest" href="manifest.webmanifest?v=3.3.0-desktop2">
  <link rel="apple-touch-icon" href="siascloud-icon-192.png?v=3.3.0-desktop2">
  <link rel="stylesheet" href="portal.css?v=3.3.0-release">
</head>
<body>
  <div id="portalSplash" class="app-splash" aria-live="polite" aria-label="Cargando Portal Mayorista">
    <div class="splash-card">
      <div class="splash-orbit">
        <span class="splash-ring ring-one"></span>
        <div class="splash-logo-box"><img src="siascloud-logo.png" alt="SiasCloud ERP"></div>
      </div>
      <strong>SiasCloud</strong>
      <span>Portal Mayorista</span>
    </div>
  </div>

  <div id="portalLogin" class="login-page">
    <main class="login-card">
      <img src="siascloud-logo.png" alt="SiasCloud ERP" class="login-logo">
      <h1>Portal Mayorista</h1>
      <p>Pedidos, documentos y cuenta comercial.</p>

      <form id="portalLoginForm">
        <div id="loginCompanyCard" class="login-auto-company waiting">
          <div class="company-logo-wrap"><img id="loginCompanyLogo" src="siascloud-logo.png" alt="Empresa"></div>
          <div class="company-detect-text">
            <strong id="loginCompanyName">Empresa pendiente de detectar</strong>
            <span id="loginCompanyMeta">Escribe tu correo y reconoceremos la empresa registrada en Mayoristas.</span>
          </div>
        </div>

        <label>Correo
          <input id="portalLoginEmail" name="email" type="email" autocomplete="username" required>
        </label>

        <label id="loginCompanySelectWrap" class="hidden">Empresa
          <select id="loginCompanySelect" name="company_id"></select>
        </label>

        <label>Clave
          <div class="password-field">
            <input id="portalLoginPassword" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" data-password-toggle="#portalLoginPassword" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>

        <button class="primary" type="submit">Ingresar</button>
      </form>

      <button id="connectionToggle" class="link-btn" type="button">Configuración de conexión</button>
      <form id="connectionForm" class="connection hidden">
        <label>URL de conexión<input name="functions_url" placeholder="URL de Servicios Cloud SiasCloud"></label>
        <button type="submit">Guardar conexión</button>
      </form>
      <div id="loginMessage" class="message"></div>
    </main>
  </div>

  <div id="portalApp" class="app hidden">
    <aside id="portalSidebar" class="sidebar">
      <div class="brand">
        <img src="siascloud-logo.png" alt="SiasCloud">
        <div><strong>SiasCloud</strong><span>Portal Mayorista</span></div>
      </div>
      <nav>
        <button data-route="home" class="active">⌂ <span>Inicio</span></button>
        <button data-route="catalog">▣ <span>Catálogo</span></button>
        <button data-route="orders">◎ <span>Mis pedidos</span></button>
        <button data-route="dtes">▤ <span>Documentos</span></button>
        <button data-route="profile">♙ <span>Mi perfil</span></button>
      </nav>
      <div class="sidebar-foot"><button id="logoutBtn">Salir</button></div>
    </aside>

    <section class="main">
      <header>
        <button id="menuBtn" class="icon-btn">☰</button>
        <div><h1 id="portalTitle">Inicio</h1><p id="companyName"></p></div>
        <div class="header-actions">
          <button id="cartBtn" class="cart-btn">Carrito <span id="cartCount">0</span></button>
          <img id="headerAvatar" class="avatar" src="siascloud-logo.png" alt="Perfil">
        </div>
      </header>
      <main id="portalContent" class="content"></main>
    </section>
  </div>

  <dialog id="portalModal">
    <form method="dialog" class="modal-card" id="modalForm">
      <div class="modal-head"><h2 id="modalTitle">Detalle</h2><button value="cancel" class="icon-btn">×</button></div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"><button value="cancel">Cerrar</button></div>
    </form>
  </dialog>

  <div id="portalToast" class="toast"></div>
<script src="sias-performance.js?v=3.3.0-velocidad-20261007"></script>
  <script src="sias-document-viewer.js?v=3.3.0-visor-integrado-20261007"></script>
  <script src="desktop-bridge.js?v=3.3.0-desktop-lite-20261007"></script>
  <script src="config.js?v=3.3.0-release"></script>
  <script src="portal.js?v=3.3.0-desktop-native-20261006"></script>
</body>
</html>
